	<title>404 HTML Template by Colorlib</title>

	<!-- Custom stlylesheet -->
<style>
* {
  -webkit-box-sizing: border-box;
          box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
}

#notfound {
  position: relative;
  height: 100vh;
}

#notfound .notfound {
  position: absolute;
  left: 50%;
  top: 50%;
  -webkit-transform: translate(-50%, -50%);
      -ms-transform: translate(-50%, -50%);
          transform: translate(-50%, -50%);
}

.notfound {
  max-width: 767px;
  width: 100%;
  line-height: 1.4;
  padding: 0px 15px;
}

.notfound .notfound-404 {
  position: relative;
  height: 150px;
  line-height: 150px;
  margin-bottom: 25px;
}

.notfound .notfound-404 h1 {
  font-family: 'Titillium Web', sans-serif;
  font-size: 186px;
  font-weight: 900;
  margin: 0px;
  text-transform: uppercase;
  background: url('/404/text.png');
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: cover;
  background-position: center;
}

.notfound h2 {
  font-family: 'Titillium Web', sans-serif;
  font-size: 26px;
  font-weight: 400;
  margin: 0;
}

.notfound p {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 0px;
  text-transform: uppercase;
}

.notfound a {
  font-family: 'Titillium Web', sans-serif;
  display: inline-block;
  text-transform: uppercase;
  color: #fff;
  text-decoration: none;
  border: none;
  background: #E65100;
  border-radius: 100px;
  padding: 19px 40px;
  font-size: 14px;
  font-weight: 700;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
  -webkit-transition: 0.2s all;
  transition: 0.2s all;
}
.notfound a:after {
	content: " ";
	position: absolute;
	left: -100px;
	top: -30px;
	width: 20px;
	height: 150px;
	background: rgba(255,255,255,.3);
-webkit-transform: rotate(45deg);
-ms-transform: rotate(45deg);
transform: rotate(45deg);
}
.notfound a:hover:after {
	left: 30px;
	animation: add2cart 1.4s infinite ease-in-out;
}
@keyframes add2cart {
	from {
		left: -100px;
	}
	to {
		left:calc(100% + 100px);
	}
}
@-webkit-keyframes add2cart {
	from {
		left: -100px;
	}
	to {
		left:calc(100% + 100px);
	}
}

@media only screen and (max-width: 767px) {
  .notfound .notfound-404 {
    height: 110px;
    line-height: 110px;
  }
  .notfound .notfound-404 h1 {

  }
}
